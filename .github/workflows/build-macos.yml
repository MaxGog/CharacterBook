name: Build macOS App (unsigned, debug)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd macos
          pod install --repo-update
          cd ..

      - name: Fix deployment target and entitlements
        run: |
          # Исправляем deployment target (замена 26.0 на 11.0)
          perl -pi -e 's/MACOSX_DEPLOYMENT_TARGET = 26.0;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' macos/Runner.xcodeproj/project.pbxproj

          touch macos/Runner/Debug.entitlements
          touch macos/Runner/Release.entitlements
          touch macos/Runner/Profile.entitlements
          touch macos/Runner/DebugProfile.entitlements

          perl -pi -e 's/CODE_SIGN_IDENTITY = ".*?";/CODE_SIGN_IDENTITY = "";/g' macos/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/CODE_SIGN_STYLE = .*?;/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/CODE_SIGNING_REQUIRED = .*?;/CODE_SIGNING_REQUIRED = NO;/g' macos/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/CODE_SIGNING_ALLOWED = .*?;/CODE_SIGNING_ALLOWED = NO;/g' macos/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/CODE_SIGN_ENTITLEMENTS = .*?;/CODE_SIGN_ENTITLEMENTS = "";/g' macos/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/DEVELOPMENT_TEAM = .*?;//g' macos/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/PROVISIONING_PROFILE_SPECIFIER = .*?;//g' macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS app (debug, unsigned)
        run: flutter build macos --debug

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: characterbook-macos-debug
          path: build/macos/Build/Products/Debug/*.app
          if-no-files-found: error
          retention-days: 30
